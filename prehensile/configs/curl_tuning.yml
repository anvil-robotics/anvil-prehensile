# Curl-map response tuning -- the only source for `--map curl`
# (`prehensile.teleop` / `prehensile.viz`). Edit and re-run. 
#
# 100 = open, 0 = closed. Channels: thumb_flex, thumb_abd, index, middle, ring,
# pinky. Per-glove invert senses live in profiles.py, not here.
#
# Keys, all optional except thumb_flex.couple_low:
#   gain   swing multiplier around `pivot`; 1.0 = off.
#   pivot  the value `gain` leaves unchanged. Raise it to push curled values lower.
#   alpha  per-channel EMA smoothing, default 0.4. Lower = smoother, laggier.
#   flip   complement the output (100 - x), for a thumb mounted mirrored.
#   park   literal value the channel holds while the bButton lock is engaged.
#   couple_low  thumb_flex and index ONLY -- anywhere else, loading fails.

thumb_flex: {gain: 2.5, pivot: 80, couple_low: 30}
thumb_abd:  {gain: 1.5, pivot: 40, park: 5}
index:      {gain: 1.2, pivot: 75, couple_low: 50}
middle:     {gain: 1.2, pivot: 75}
ring:       {gain: 1.2, pivot: 75}
pinky:      {gain: 1.2, pivot: 75}

# The right thumb is mounted mirrored, so its tracked metric reads backwards:
# thumb_abd flips, thumb_flex does not. Both stated explicitly.
right:
  thumb_flex: {flip: false}
  thumb_abd:  {flip: true}

# *** KNOWN ISSUE (right hand): `park` bypasses flip, so the shared thumb_abd park
# lands on opposite physical ends per hand -- ~tucked on the left, ~spread on the
# right. The right thumb parks away from its fingers and its pinch is
# geometrically wrong. Fix with `right: thumb_abd: {park: N}`, N confirmed on
# hardware; the current value was only ever dialed in for the LEFT hand. ***
